name: ci

on:
  push:
    branches: [main, memory-refactor]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install protoc
        # lance-encoding (via lancedb) uses prost-build and needs protoc.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          # The LanceDB dep tree is big; cache shared across matrix jobs.
          shared-key: ling-mem

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        # Warnings-as-errors is handled by RUSTFLAGS above; also deny clippy.
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo build
        run: cargo build --locked

      - name: cargo test
        run: cargo test --lib --locked
