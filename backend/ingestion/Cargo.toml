[package]
name = "ingestion"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }


[dependencies]
linggen-core = { path = "../core" }
async-trait = "0.1"

tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"

# File System watching (used by API's internal indexer for memory files)
notify = "6.1"

# Document extraction (PDF, DOCX uploads)
pdf-extract = "0.7"
dotext = "0.1"

[dev-dependencies]
tempfile = "3.8"
